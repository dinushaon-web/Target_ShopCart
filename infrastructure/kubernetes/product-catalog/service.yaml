apiVersion: v1
kind: Service
metadata:
  name: product-catalog-service
  namespace: shopcart
  labels:
    app: product-catalog-service
spec:
  type: ClusterIP
  selector:
    app: product-catalog-service
  ports:
  - name: http
    port: 80
    targetPort: 3000
    protocol: TCP
  sessionAffinity: None
