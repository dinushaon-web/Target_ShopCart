apiVersion: v1
kind: ConfigMap
metadata:
  name: product-catalog-config
  namespace: shopcart
  labels:
    app: product-catalog-service
data:
  AWS_REGION: "us-east-1"
  PRODUCTS_TABLE: "products"
  SECRET_NAME: "shopcart/credentials"
  LOG_LEVEL: "info"
  NODE_ENV: "production"
  SERVICE_NAME: "product-catalog-service"
  APP_VERSION: "1.0.0"
  COGNITO_REGION: "us-east-1"
