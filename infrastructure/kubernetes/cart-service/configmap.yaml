apiVersion: v1
kind: ConfigMap
metadata:
  name: cart-service-config
  namespace: shopcart
  labels:
    app: cart-service
data:
  AWS_REGION: "us-east-1"
  CARTS_TABLE: "carts"
  SECRET_NAME: "shopcart/credentials"
  LOG_LEVEL: "info"
  NODE_ENV: "production"
  SERVICE_NAME: "cart-service"
  APP_VERSION: "1.0.0"
  COGNITO_REGION: "us-east-1"
